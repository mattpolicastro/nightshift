name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  schedule:
    # Daily: catches a Paseo SDK release that breaks the plugin before the app updates.
    - cron: '17 9 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # specloop verifies under macOS sandbox-exec, so its tests need macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv run pytest -q

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/nightshift
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/nightshift/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  plugin-canary:
    # The manifest has no upper bound, so check the plugin against SDKs it has not been built with.
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        sdk: [latest, beta]
    defaults:
      run:
        working-directory: plugins/nightshift
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/nightshift/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts @getpaseo/plugin@${{ matrix.sdk }}
      - run: npm ls @getpaseo/plugin
      - run: npm run typecheck
      - run: npm test

  types:
    # New mypy errors fail; the committed baseline is tolerated and shrinks over time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv run python scripts/check_types.py
