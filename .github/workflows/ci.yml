name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  schedule:
    # Daily: catches a Paseo SDK release that breaks the plugin before the app updates.
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # specloop verifies under macOS sandbox-exec, so its tests need macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv run pytest -q

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/nightshift
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/nightshift/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test

  plugin-canary:
    # The manifest has no upper bound, so check the plugin against SDKs it has not been built with.
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        sdk: [latest, beta]
    defaults:
      run:
        working-directory: plugins/nightshift
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins/nightshift/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --ignore-scripts @getpaseo/plugin@${{ matrix.sdk }}
      - run: npm ls @getpaseo/plugin
      - run: npm run typecheck
      - run: npm test

  types:
    # New mypy errors fail; the committed baseline is tolerated and shrinks over time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv run python scripts/check_types.py

  gitea-contract:
    # Live contracts against a pinned Gitea; off for pull requests (a red result
    # here means Gitea's API moved, not that the PR broke something).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    services:
      gitea:
        # gitea/gitea:28.2.0; multi-platform digest resolved from Docker Hub.
        # sha256:30777c91280d973fa02be48b1ade735bd6859e8f6f7af3b4444d519437852504
        image: gitea/gitea@sha256:30777c91280d973fa02be48b1ade735bd6859e8f6f7af3b4444d519437852504
        env:
          GITEA__security__INSTALL_LOCK: 'true'
          GITEA__database__DB_TYPE: sqlite3
          GITEA__service__DISABLE_REGISTRATION: 'true'
          GITEA__server__ROOT_URL: http://127.0.0.1:3000/
        ports:
          - 3000:3000
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:3000/api/healthz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Provision disposable API fixtures
        env:
          GITEA_CONTAINER: ${{ job.services.gitea.id }}
        run: uv run python scripts/gitea_contract_setup.py --container "$GITEA_CONTAINER"
      - name: Run fake and live contracts
        # Env variables alone do not select the live parametrization.
        env:
          PYTEST_ADDOPTS: --gitea-live
        run: uv run pytest -q tests/contract
