name: gitea-contract

on:
  push:
    branches: [main]
  schedule:
    - cron: '43 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitea-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      gitea:
        # gitea/gitea:28.2.0; multi-platform digest resolved from Docker Hub.
        # sha256:30777c91280d973fa02be48b1ade735bd6859e8f6f7af3b4444d519437852504
        image: gitea/gitea@sha256:30777c91280d973fa02be48b1ade735bd6859e8f6f7af3b4444d519437852504
        env:
          GITEA__security__INSTALL_LOCK: 'true'
          GITEA__database__DB_TYPE: sqlite3
          GITEA__service__DISABLE_REGISTRATION: 'true'
          GITEA__server__ROOT_URL: http://127.0.0.1:3000/
        ports:
          - 3000:3000
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:3000/api/healthz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: Provision disposable API fixtures
        env:
          GITEA_CONTAINER: ${{ job.services.gitea.id }}
        run: uv run python scripts/gitea_contract_setup.py --container "$GITEA_CONTAINER"
      - name: Run fake and live contracts
        # Env variables alone do not select the live parametrization.
        env:
          PYTEST_ADDOPTS: --gitea-live
        run: uv run pytest -q tests/contract
