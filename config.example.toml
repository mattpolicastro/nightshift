# Copy to config.toml (gitignored) and edit.
# Engine enrollment is a human edit. Specloop is the only engine and the default
# when engine is omitted. Explicit engine = "worker" is rejected at config load.
# Supply a trusted manifest for each repository; no worker settings are converted.
# ~/.nightshift/pause blocks specloop intake, approval, revision and publication;
# already-admitted runs continue under the separate specloop supervisor.

[daemon]
# Inert worktree_root compatibility: no new work is placed here, and specloop
# run state is separate. Omission retains the historical default:
# worktree_root = "~/Projects/nightshift-wt"
# Leading ~/ expands; spaces stay literal. Relative values now resolve beside
# the selected config file, not the daemon cwd. To keep an old relative location,
# set its absolute path before restart. Absolute paths and existing worktrees
# stay in place; loading does not create or migrate directories. Wrong types,
# blank strings, unsupported tilde forms and NUL/line breaks are rejected.
# Example alternate root: worktree_root = "/alternate/nightshift-wt"
# Host tool/checkout settings belong in process environments, not a TOML table:
# NIGHTSHIFT_BIN_DIR defaults to /opt/homebrew/bin (Python and plugin tools);
# NIGHTSHIFT_NODE_BIN to ~/n/bin (Factory); NIGHTSHIFT_UV to the resolved bin
# directory plus /uv; NIGHTSHIFT_CHECKOUT to ~/Projects/nightshift (plugin).
# Restart affected processes. The daemon env file wins over inherited settings
# downstream, but neither frozen wrapper relocates its bootstrap paths.
# See README.md#host-path-setup and KNOWN-LIMITATIONS.md#platform-assumptions
# for service environments, deferred wrapper portability and pending host checks.
poll_seconds = 120
# A repo the GH_TOKEN must NOT be able to read. `nightshift preflight` uses it
# as a negative control: a token that reaches the sandbox proves nothing about
# what else it reaches, and a credential check without a thing that must FAIL
# is not a check. Point it at something real and off-limits.
forbidden_probe = "example-owner/dotfiles"
# Legacy keys are accepted by presence, ignored and reported by key name only:
# top-level models/endpoints; repos.models/verify/concurrency; and daemon
# max_tasks_per_night/concurrency/review_attempts/implement_max_turns/
# review_max_turns/mirror_to_paseo. Even a zero task cap cannot stop builds.
# No endpoint is contacted, credential forwarded or manifest generated from them.
# Repo.verify/concurrency and Config.mirror_to_paseo remain inert compatibility
# fields; worktree_root retains its path validation and defaults above.

[[repos]]
name = "example-owner/sample-sandbox"
# Enroll one sandbox first, then one low-stakes real repo. Edit this path to an
# operator-controlled manifest outside the repository being built.
manifest = "~/.config/specloop/manifests/sample-sandbox.toml"
# engine = "specloop"  # optional: omission selects the same engine
base = "main"
# Historical clone-path compatibility; the manifest's run.repo selects the
# build checkout. Omitted dir retains ~/Projects/<repo-name> for utilities.
# dir = "~/Projects/nightshift-clones/sample"

# Relative manifest paths resolve beside config.toml; ~ expands. Loading does
# not require the file to exist. Missing or unusable manifests hold only that
# repository's new work; repair at the same path is retried on a later poll.
# Supplied empty/wrong-type paths and malformed config TOML remain load errors.
# Use one trusted manifest per repository: [run] repo is its local checkout,
# github is owner/repo, and pr_base matches base. The daemon overrides change
# and branch per issue, and admission stores that copy.
# Profiles/roles, quotas, allowed/frozen paths and verification belong in the
# manifest. See examples/specloop/self-hosting.toml for a separate provider example;
# adapt it for your repository. Provider credentials/tools remain provider-owned.
# Direct Python front-door commands need no worker verify string, endpoint models
# or worker OAuth. The frozen bin/nightshift-daemon wrapper still requires its
# env file, worker OAuth, GH_TOKEN and gh/claude/pnpm/node/git/swift before Python
# starts; service rollout needs separate host checks (see docs/specloop/README.md).
# Make specloop available on the daemon's PATH and run its separate supervisor
# (`nightshift serve`). Pausing or stopping the daemon does not stop admitted builds.
# `nightshift daemon status` omits worker sessions, working counts and the off-subscription
# model report; all other status output remains unchanged. Historical outcomes
# remain available through `nightshift attention`.
#
# Label flow: spec:draft (or agent:ready) on an issue -> draft PR with spec:review
# -> human adds spec:approved on the PR -> admitted build -> publish to SAME PR
# -> human checks and merges. The PR links the issue with Closes #N.
# agent:revise goes on the PR: before admission it re-drafts the spec; after
# admission it adds review tasks. Feedback uses per-repository/PR, source-qualified
# consumed IDs: comments arriving during a round remain eligible; edits to consumed
# comments need a new comment ID. See docs/specloop/README.md for revision details.
# needs-human carries questions/refusals. Draft questions or rejection remove
# both intake labels: answer or resolve them on the issue, remove needs-human,
# and reapply spec:draft or agent:ready. Removing needs-human alone does not
# requeue the issue. A refused admission removes spec:approved; resolve it,
# remove needs-human and reapply spec:approved on the PR.
# `nightshift attention` lists human pauses; unreadable status retains STALE data.
#
# Optional [[prepare]] belongs in the MANIFEST, not this daemon config:
#   [vars]
#   node_bin = "~/n/bin"
#   [sandbox]
#   prepare_read = ["~/n"]
#   [[prepare]]
#   id = "dependencies"
#   run = ["/bin/sh", "-c", "export PATH=\"{node_bin}:$PATH\" && cp -R \"{src}/.\" \"{build}/project\" && chmod -R u+w \"{build}/project\" && cd \"{build}/project\" && pnpm install --frozen-lockfile"]
#   expect = 0
#   timeout = 600
#   [[verify]]
#   id = "tests"
#   run = ["/usr/bin/env", "PATH={node_bin}:/usr/bin:/bin", "pnpm", "--dir", "{build}/project", "test"]
# Prepare uses the same fields as verify (expect defaults to 0, timeout to 300s).
# It runs after extraction, before offline verification, with build as cwd.
# Its sandbox permits network, confines writes to build and denies credential
# reads; extracted source stays read-only. Receipts/logs record each step, and
# an unexpected exit or timeout fails verification before later steps run.
# Commands are trusted; freeze the lockfile when the dependency contract needs it.
# See README.md and docs/specloop/prepare.md for enrollment and prepare details.

[notify]
# Slack incoming webhook. LEAVE THIS EMPTY and put the URL in
# ~/.config/nightshift/env instead:
#
#   export NIGHTSHIFT_SLACK_WEBHOOK='https://hooks.slack.com/services/...'
#
# A webhook is a credential — anyone holding it can post to the channel — and
# that file (chmod 600) is already where the OAuth and GitHub tokens live, so
# there is one file to audit and one to rotate. The env var wins if both are
# set. Unconfigured is a silent no-op, so an unattended night runs and tells
# you nothing; `nightshift daemon status` says whether alerting is live.
slack_webhook = ""

[labels]
# agent:ready is an issue-intake alias for spec:draft; working/done are retained
# for historical state and safe leftover-claim recovery.
ready = "agent:ready"
working = "agent:working"
done = "agent:done"
needs_human = "needs-human"
# Specloop stages: issue intake, daemon-set PR review, human-set PR approval.
spec_draft = "spec:draft"
spec_review = "spec:review"
spec_approved = "spec:approved"
# agent:revise is fixed: on a specloop PR it requests spec or build revision,
# depending on whether the change has been admitted.
